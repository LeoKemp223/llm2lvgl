<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>llm2lvgl Web UI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=3">
</head>
<body>
<div class="container">
  <h1><span>llm2lvgl</span> Web UI</h1>

  <!-- Input section -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="html">上传 HTML</button>
    <button class="tab-btn" data-tab="image">上传图片</button>
    <button class="tab-btn" data-tab="url">输入网址</button>
  </div>

  <div id="tab-html" class="tab-content active">
    <div class="drop-zone" id="html-drop-zone">
      <div>拖拽 HTML 文件到此处，或点击选择<br><small>支持单个 HTML 或 HTML + CSS/JS/图片（可多选）</small></div>
      <input type="file" id="html-file" accept=".html,.htm,.css,.js,.png,.jpg,.jpeg,.gif,.svg,.webp,.woff,.woff2,.ttf,.eot" multiple>
    </div>
    <div class="file-list" id="html-file-list"></div>
  </div>
  <div id="tab-image" class="tab-content">
    <div class="drop-zone" id="image-drop-zone">
      <div>拖拽图片到此处，或点击选择<br><small>主截图 + 可选的图标/资源图片</small></div>
      <input type="file" id="image-file" accept="image/*" multiple>
    </div>
    <div class="file-list" id="image-file-list"></div>
  </div>
  <div id="tab-url" class="tab-content">
    <div class="form-group">
      <label for="url-input">页面网址</label>
      <input type="url" id="url-input" placeholder="https://example.com/page">
    </div>
  </div>

  <!-- Settings -->
  <details class="settings" id="settings-panel" open>
    <summary>LLM 设置</summary>
    <div class="settings-body">
      <div class="form-group">
        <label for="setting-api-key">API Key</label>
        <input type="password" id="setting-api-key" placeholder="sk-...">
      </div>
      <div class="form-group">
        <label for="setting-model">模型</label>
        <input type="text" id="setting-model" list="model-candidates" placeholder="例如 gpt-4o、deepseek-chat，或输入任意模型名称">
        <datalist id="model-candidates">
          <option value="gpt-4o">
          <option value="gpt-4o-mini">
          <option value="gpt-4.1">
          <option value="gpt-4.1-mini">
          <option value="gpt-4.1-nano">
          <option value="deepseek-chat">
          <option value="deepseek-reasoner">
        </datalist>
      </div>
      <div class="form-group">
        <label for="setting-base-url">Base URL（可选）</label>
        <input type="url" id="setting-base-url" placeholder="https://api.openai.com/v1">
      </div>
      <button class="btn btn-sm" id="save-settings-btn">保存</button>
      <span class="settings-msg" id="settings-msg"></span>
    </div>
  </details>

  <div class="form-group">
    <label>目标平台</label>
    <select id="profile-select"></select>
    <div id="custom-profile" class="custom-profile" style="display:none">
      <div class="form-group" style="margin-top:10px">
        <label for="custom-profile-name">平台名称</label>
        <input type="text" id="custom-profile-name" placeholder="例如: Raspberry Pi 7inch">
      </div>
      <div class="profile-resolution">
        <div class="form-group" style="flex:1">
          <label for="custom-width">宽度 (px)</label>
          <input type="number" id="custom-width" min="100" max="4096" placeholder="1024">
        </div>
        <span class="resolution-x">&times;</span>
        <div class="form-group" style="flex:1">
          <label for="custom-height">高度 (px)</label>
          <input type="number" id="custom-height" min="100" max="4096" placeholder="600">
        </div>
      </div>
    </div>
  </div>
  <div class="form-group">
    <label for="task-name">任务名称（可选）</label>
    <input type="text" id="task-name" placeholder="my_dashboard">
  </div>
  <button class="btn" id="start-btn">开始</button>
  <button class="btn btn-stop" id="stop-btn" style="display:none">停止</button>

  <!-- Progress section -->
  <div class="steps">
    <span class="step" data-step="init">初始化</span>
    <span class="step" data-step="generate">生成</span>
    <span class="step" data-step="lint">检查</span>
    <span class="step" data-step="build">构建</span>
    <span class="step" data-step="validate">验证</span>
    <span class="step" data-step="refine">精调</span>
    <span class="step" data-step="export">导出</span>
  </div>
  <div class="log-box"></div>

  <!-- Results section -->
  <div class="results">
    <div class="report-summary" id="report-summary"></div>
    <div class="image-compare">
      <figure><img id="img-ref" alt="参考图"><figcaption>参考图 / 当前图</figcaption></figure>
      <figure><img id="img-actual" alt="完整截图"><figcaption>完整截图</figcaption></figure>
      <figure><img id="img-diff" alt="差异热力图"><figcaption>差异热力图</figcaption></figure>
    </div>
    <button class="btn" id="download-btn">下载 LVGL 交付包</button>
    <div class="code-preview">
      <button class="code-toggle">查看生成的代码</button>
      <pre class="code-block" id="code-block"></pre>
    </div>
  </div>

  <!-- History -->
  <div class="history">
    <h3>历史记录</h3>
    <ul class="task-list" id="task-list"></ul>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox"><img id="lightbox-img" alt="放大查看"></div>

<script src="{{ url_for('static', filename='app.js') }}?v=3"></script>
</body>
</html>
