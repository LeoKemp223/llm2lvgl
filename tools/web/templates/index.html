<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>llm2lvgl Web UI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
  <h1><span>llm2lvgl</span> Web UI</h1>

  <!-- Input section -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="html">Upload HTML</button>
    <button class="tab-btn" data-tab="image">Upload Image</button>
    <button class="tab-btn" data-tab="url">Enter URL</button>
  </div>

  <div id="tab-html" class="tab-content active">
    <div class="drop-zone" id="html-drop-zone">
      <div>Drop HTML file(s) here or click to select<br><small>Supports single HTML or HTML + CSS/JS/images (multi-select)</small></div>
      <input type="file" id="html-file" accept=".html,.htm,.css,.js,.png,.jpg,.jpeg,.gif,.svg,.webp,.woff,.woff2,.ttf,.eot" multiple>
    </div>
    <div class="file-list" id="html-file-list"></div>
  </div>
  <div id="tab-image" class="tab-content">
    <div class="drop-zone" id="image-drop-zone">
      <div>Drop image(s) here or click to select<br><small>Main screenshot + optional icon/asset images</small></div>
      <input type="file" id="image-file" accept="image/*" multiple>
    </div>
    <div class="file-list" id="image-file-list"></div>
  </div>
  <div id="tab-url" class="tab-content">
    <div class="form-group">
      <label for="url-input">Page URL</label>
      <input type="url" id="url-input" placeholder="https://example.com/page">
    </div>
  </div>

  <!-- Settings -->
  <details class="settings" id="settings-panel" open>
    <summary>LLM Settings</summary>
    <div class="settings-body">
      <div class="form-group">
        <label for="setting-api-key">API Key</label>
        <input type="password" id="setting-api-key" placeholder="sk-...">
      </div>
      <div class="form-group">
        <label for="setting-model">Model</label>
        <select id="setting-model">
          <optgroup label="OpenAI">
            <option value="gpt-4o">GPT-4o</option>
            <option value="gpt-4o-mini">GPT-4o Mini</option>
            <option value="gpt-4.1">GPT-4.1</option>
            <option value="gpt-4.1-mini">GPT-4.1 Mini</option>
            <option value="gpt-4.1-nano">GPT-4.1 Nano</option>
          </optgroup>
          <optgroup label="DeepSeek">
            <option value="deepseek-chat">DeepSeek Chat (V3)</option>
            <option value="deepseek-reasoner">DeepSeek Reasoner (R1)</option>
          </optgroup>
        </select>
      </div>
      <div class="form-group">
        <label for="setting-base-url">Base URL (optional)</label>
        <input type="url" id="setting-base-url" placeholder="https://api.openai.com/v1">
      </div>
      <button class="btn btn-sm" id="save-settings-btn">Save</button>
      <span class="settings-msg" id="settings-msg"></span>
    </div>
  </details>

  <div class="form-group">
    <label for="profile-select">Board Profile</label>
    <select id="profile-select"></select>
  </div>
  <div class="form-group">
    <label for="task-name">Task Name (optional)</label>
    <input type="text" id="task-name" placeholder="my_dashboard">
  </div>
  <button class="btn" id="start-btn">Start</button>
  <button class="btn btn-stop" id="stop-btn" style="display:none">Stop</button>

  <!-- Progress section -->
  <div class="steps">
    <span class="step" data-step="init">init</span>
    <span class="step" data-step="generate">generate</span>
    <span class="step" data-step="lint">lint</span>
    <span class="step" data-step="build">build</span>
    <span class="step" data-step="validate">validate</span>
    <span class="step" data-step="refine">refine</span>
    <span class="step" data-step="export">export</span>
  </div>
  <div class="log-box"></div>

  <!-- Results section -->
  <div class="results">
    <div class="report-summary" id="report-summary"></div>
    <div class="image-compare">
      <figure><img id="img-ref" alt="Reference"><figcaption>Reference / Current</figcaption></figure>
      <figure><img id="img-actual" alt="Full screenshot"><figcaption>Full Screenshot</figcaption></figure>
      <figure><img id="img-diff" alt="Diff"><figcaption>Diff Heatmap</figcaption></figure>
    </div>
    <button class="btn" id="download-btn">Download LVGL Bundle</button>
    <div class="code-preview">
      <button class="code-toggle">Show Generated Code</button>
      <pre class="code-block" id="code-block"></pre>
    </div>
  </div>

  <!-- History -->
  <div class="history">
    <h3>History</h3>
    <ul class="task-list" id="task-list"></ul>
  </div>
</div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
